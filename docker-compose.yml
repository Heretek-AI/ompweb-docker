# docker-compose.yml — quick-start for ompweb + oh-my-pi.
#
# 1. cp .env.example .env && edit .env (set OMP_WEB_PASSWORD at least)
# 2. docker compose pull   # fetch the latest image
# 3. docker compose up -d
# 4. open http://localhost:30177

services:
  ompweb:
    # Pull from GHCR. Override GHCR_OWNER in .env if you forked this repo.
    image: ghcr.io/${GHCR_OWNER:-heretek-ai}/ompweb-docker:${TAG:-latest}
    container_name: ompweb
    restart: unless-stopped

    # tini is baked into the image's ENTRYPOINT, so we don't need Compose's init.

    # The entrypoint runs as root to initialize /data/omp (named volumes
    # mount root-owned on first use), then drops to UID 1001 via gosu
    # before exec'ing the ompweb launcher. We use Docker's DEFAULT
    # capability set (which includes CHOWN, SETUID, SETGID, FOWNER,
    # DAC_OVERRIDE) rather than cap_drop: ALL — dropping ALL and
    # re-adding granular caps proved unreliable across hosts (gosu's
    # setuid and volume chown both failed on btrfs/seclabel filesystems
    # even with the caps listed). no-new-privileges still blocks
    # setuid-binary privilege escalation.
    security_opt:
      - no-new-privileges:true

    ports:
      - "30177:30177"

    env_file:
      - .env

    volumes:
      # Persistent agent state: omp config, session index, models, etc.
      - ompweb_data:/data

      # OPTIONAL: bind-mount your source code so omp can edit it.
      # Uncomment the next line and set WORKSPACE_DIR in .env to point at
      # the directory you want omp to work on.
      # - ${WORKSPACE_DIR:-./workspace}:/workspace

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30177/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  ompweb_data:
    # Named volume (managed by Docker, portable across hosts).
    name: ompweb_data
