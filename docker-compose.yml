# docker-compose.yml — quick-start for ompweb + oh-my-pi.
#
# 1. cp .env.example .env && edit .env (set OMP_WEB_PASSWORD at least)
# 2. docker compose pull   # fetch the latest image
# 3. docker compose up -d
# 4. open http://localhost:30177

services:
  ompweb:
    # Pull from GHCR. Override GHCR_OWNER in .env if you forked this repo.
    image: ghcr.io/${GHCR_OWNER:-heretek-ai}/ompweb-docker:${TAG:-latest}
    container_name: ompweb
    restart: unless-stopped

    # tini is baked into the image's ENTRYPOINT, so we don't need Compose's init.

    # Run entirely as UID 1001 (never root). The image ships /data/omp
    # owned by UID 1001, and Docker copies it into the fresh named
    # volume on first mount — so the app user owns its data dir with no
    # root setup at runtime. That makes cap_drop: ALL safe (nothing in
    # the container needs a capability) and portable across hosts
    # (btrfs/seclabel/userns quirks can't break it).
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ports:
      - "30177:30177"

    env_file:
      - .env

    volumes:
      # Persistent agent state: omp config, session index, models, etc.
      - ompweb_data:/data

      # OPTIONAL: bind-mount your source code so omp can edit it.
      # Uncomment the next line and set WORKSPACE_DIR in .env to point at
      # the directory you want omp to work on.
      # - ${WORKSPACE_DIR:-./workspace}:/workspace

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:30177/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  ompweb_data:
    # Named volume (managed by Docker, portable across hosts).
    name: ompweb_data
