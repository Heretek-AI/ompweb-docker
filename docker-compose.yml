# docker-compose.yml — quick-start for the omp + ompweb sandbox.
#
# 1. cp .env.example .env && edit .env (set OMP_WEB_PASSWORD at least)
# 2. mkdir -p workspace data/omp data/config data/ssh && chmod 700 data/ssh
# 3. docker compose pull
# 4. docker compose up -d
# 5. open http://localhost:3000
#
# The container starts as root so the entrypoint can remap PUID/PGID, join the
# Docker socket's group, and chown the mounted volumes; it then drops to the
# unprivileged `omp` user with gosu before any user code runs.

services:
  ompweb:
    image: ghcr.io/${GHCR_OWNER:-heretek-ai}/ompweb-docker:${TAG:-latest}
    container_name: ompweb
    restart: unless-stopped

    ports:
      - "${OMPWEB_PORT:-3000}:3000"

    env_file:
      - .env

    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"

    volumes:
      # Your code — omp's workspace.
      - ${WORKSPACE_DIR:-./workspace}:/workspace
      # Agent state: sessions, blobs, projects.json, models.yml, agent.db, skills.
      - ${OMP_DATA_DIR:-./data/omp}:/home/omp/.omp
      # Tool config: gh auth, git config.
      - ${OMP_CONFIG_DIR:-./data/config}:/home/omp/.config
      # SSH keys, read-only. Use `chmod 700 data/ssh`.
      - ${OMP_SSH_DIR:-./data/ssh}:/home/omp/.ssh:ro
      # Docker daemon access via the host socket (client-only CLI in the image).
      # Docker creates a DIRECTORY at a missing bind source, so hosts without a
      # daemon should comment this line out.
      - /var/run/docker.sock:/var/run/docker.sock

    # Makes host.docker.internal resolve on Linux (Ollama/vLLM/LM Studio on the host).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # CHOWN/DAC_OVERRIDE/FOWNER for the volume fix-ups, SETUID/SETGID for the
    # gosu privilege drop. No other capability is needed.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
