# GitHub Actions — auto-build and publish the ompweb image to GHCR.
#
# Triggers:
#   - push to main                      -> tags: main, main-<sha>, latest
#   - tag matching v*.*.*               -> tags: X.Y.Z, X.Y, X, sha
#   - pull_request                      -> build only (no push), tag: pr-<num>-<sha>
#   - workflow_dispatch                 -> manual trigger using current branch

name: docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel in-progress runs on the same branch/tag, except for release tags
# (don't cancel a release that's almost done).
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pin the ompweb ref to whatever the workflow is running against.
      # For PRs this is the PR head ref; for pushes/tags this is the branch/tag.
      # Route head_ref through an env var to avoid script-injection warnings.
      - name: Resolve ompweb ref
        id: ompweb-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # ---- Metadata: branch push to main → main, main-<sha>, latest ----
      - name: Extract Docker metadata (branch)
        id: meta-branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=ompweb
            org.opencontainers.image.description=Containerized oh-my-pi (omp) + ompweb web UI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # ---- Metadata: tag push (v*.*.*) → semver + sha ----
      - name: Extract Docker metadata (tag)
        id: meta-tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=ompweb
            org.opencontainers.image.description=Containerized oh-my-pi (omp) + ompweb web UI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # ---- Metadata: pull request → pr-<num>-<sha> (build only, no push) ----
      - name: Extract Docker metadata (pr)
        id: meta-pr
        if: github.event_name == 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}-{{sha}}
          labels: |
            org.opencontainers.image.title=ompweb
            org.opencontainers.image.description=Containerized oh-my-pi (omp) + ompweb web UI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # ---- Metadata: workflow_dispatch → main-<sha> ----
      - name: Extract Docker metadata (manual)
        id: meta-manual
        if: github.event_name == 'workflow_dispatch'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=manual
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=ompweb
            org.opencontainers.image.description=Containerized oh-my-pi (omp) + ompweb web UI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      # Compose the final tag/label list from whichever metadata step ran.
      # Use bash ${VAR:-fallback} so an empty string falls through cleanly.
      # Multi-line outputs require GitHub's heredoc form: <<DELIMITER.
      - name: Collect metadata outputs
        id: meta
        env:
          BRANCH_TAGS: ${{ steps.meta-branch.outputs.tags }}
          BRANCH_LABELS: ${{ steps.meta-branch.outputs.labels }}
          TAG_TAGS: ${{ steps.meta-tag.outputs.tags }}
          TAG_LABELS: ${{ steps.meta-tag.outputs.labels }}
          PR_TAGS: ${{ steps.meta-pr.outputs.tags }}
          PR_LABELS: ${{ steps.meta-pr.outputs.labels }}
          MANUAL_TAGS: ${{ steps.meta-manual.outputs.tags }}
          MANUAL_LABELS: ${{ steps.meta-manual.outputs.labels }}
        run: |
          TAGS="${BRANCH_TAGS:-${TAG_TAGS:-${PR_TAGS:-${MANUAL_TAGS:-}}}}"
          LABELS="${BRANCH_LABELS:-${TAG_LABELS:-${PR_LABELS:-${MANUAL_LABELS:-}}}}"
          {
            echo "tags<<__OMPWEB_META_EOF__"
            echo "${TAGS}"
            echo "__OMPWEB_META_EOF__"
            echo "labels<<__OMPWEB_META_EOF__"
            echo "${LABELS}"
            echo "__OMPWEB_META_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OMPWEB_REF=${{ steps.ompweb-ref.outputs.ref }}
            OMP_VERSION=latest
          # Free GHA-backed cache; reduces build time on repeat runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA provenance + SBOM (requires the `attestations: write` perm).
          provenance: true
          sbom: true

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
