# GitHub Actions — build and publish the omp-sandbox image to GHCR.
#
# Triggers:
#   - daily schedule (04:00 UTC)  -> rebuild only when upstream moved
#   - push to main                -> rebuild only when upstream moved
#   - workflow_dispatch           -> manual; inputs pick the omp/ompweb repos+refs
#
# The image is built natively on two runners (amd64 + arm64) and the digests
# are merged into one multi-arch tag set.

name: docker

on:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      omp_repo:
        description: 'oh-my-pi repository (owner/name)'
        required: false
        default: can1357/oh-my-pi
      omp_ref:
        description: 'oh-my-pi ref (branch, tag, or SHA)'
        required: false
        default: main
      omp_build:
        description: 'How to obtain omp: a published release binary, or build from source'
        type: choice
        options: [release, source]
        default: release
      ompweb_repo:
        description: 'ompweb repository (owner/name)'
        required: false
        default: kahme247/ompweb
      ompweb_ref:
        description: 'ompweb ref (branch, tag, or SHA)'
        required: false
        default: main
      push_latest:
        description: 'Also publish the `latest` tag'
        type: boolean
        default: true
      force:
        description: 'Rebuild even when the upstream tags are unchanged'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      omp_tag: ${{ steps.resolve.outputs.omp_tag }}
      ompweb_tag: ${{ steps.resolve.outputs.ompweb_tag }}
      version_tag: ${{ steps.resolve.outputs.version_tag }}
      build_needed: ${{ steps.decide.outputs.build_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve upstream tags
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMP_REPO: ${{ inputs.omp_repo || 'can1357/oh-my-pi' }}
          OMP_REF: ${{ inputs.omp_ref || 'main' }}
          OMP_BUILD: ${{ inputs.omp_build || 'release' }}
          OMPWEB_REPO: ${{ inputs.ompweb_repo || 'kahme247/ompweb' }}
          OMPWEB_REF: ${{ inputs.ompweb_ref || 'main' }}
        run: |
          set -euo pipefail

          commit_sha() {
            gh api "repos/$1/commits/$2" --jq '.sha[0:7]'
          }

          if [ "$OMP_BUILD" = "source" ]; then
            omp_tag="$(commit_sha "$OMP_REPO" "$OMP_REF")"
          elif printf '%s' "$OMP_REF" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            omp_tag="$OMP_REF"
          else
            omp_tag="$(gh api "repos/$OMP_REPO/releases/latest" --jq '.tag_name')"
          fi

          ompweb_tag="$(commit_sha "$OMPWEB_REPO" "$OMPWEB_REF")"

          version_tag="$(printf '%s-%s' "$omp_tag" "$ompweb_tag" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"

          {
            echo "omp_tag=${omp_tag}"
            echo "ompweb_tag=${ompweb_tag}"
            echo "version_tag=${version_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether a build is needed
        id: decide
        env:
          VERSION_TAG: ${{ steps.resolve.outputs.version_tag }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force requested; building regardless" >&2
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker buildx imagetools inspect "${image}:${VERSION_TAG}" >/dev/null 2>&1; then
            echo "tag ${VERSION_TAG} already published; skipping build" >&2
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag ${VERSION_TAG} is missing; building" >&2
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.build_needed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:build-${{ matrix.arch }}
          build-args: |
            OMP_REPO=${{ inputs.omp_repo || 'can1357/oh-my-pi' }}
            OMP_REF=${{ inputs.omp_ref || 'main' }}
            OMP_BUILD=${{ inputs.omp_build || 'release' }}
            OMPWEB_REPO=${{ inputs.ompweb_repo || 'kahme247/ompweb' }}
            OMPWEB_REF=${{ inputs.ompweb_ref || 'main' }}
            BUN_VERSION=1.4.2
            UV_VERSION=0.12.17
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: true
          sbom: true
          outputs: type=image,push-by-digest=true,name-canonical=true

      - name: Export digest
        run: |
          set -euo pipefail
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digest-${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digest-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Merge and tag the multi-arch image
        env:
          OMP_TAG: ${{ needs.resolve.outputs.omp_tag }}
          OMPWEB_TAG: ${{ needs.resolve.outputs.ompweb_tag }}
          VERSION_TAG: ${{ needs.resolve.outputs.version_tag }}
          PUSH_LATEST: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.push_latest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"

          args=()
          for digest in /tmp/digests/digest-*; do
            args+=("${image}@$(cat "$digest")")
          done

          tags=("${image}:${VERSION_TAG}" "${image}:omp-${OMP_TAG}" "${image}:ompweb-${OMPWEB_TAG}")
          if [ "$PUSH_LATEST" = "true" ]; then
            tags+=("${image}:latest")
          fi

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          docker buildx imagetools create "${tag_args[@]}" "${args[@]}"

      - name: Scan the published image
        # Advisory only: a finding never gates the release.
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.resolve.outputs.version_tag }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
