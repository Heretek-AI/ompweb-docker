# GitHub Actions — auto-build and publish the ompweb image to GHCR.
#
# Triggers:
#   - push to main                      -> tags: main, main-<sha>, latest
#   - tag matching v*.*.*               -> tags: vX.Y.Z, X.Y.Z, X.Y, X, latest (if most recent)
#   - pull_request                      -> build only (no push), tag: pr-<num>
#   - workflow_dispatch                 -> manual trigger using current branch

name: docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel in-progress runs on the same branch/tag, except for release tags
# (don't cancel a release that's almost done).
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pin the ompweb ref to whatever the workflow is running against.
      # For PRs this is the PR head ref; for pushes/tags this is the branch/tag.
      # Route head_ref through an env var to avoid script-injection warnings.
      - name: Resolve ompweb ref
        id: ompweb-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semver for tagged releases
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Immutable per-commit ref
            type=sha,format=long
            # Branch / latest / PR tags
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=pr-{{head_ref}},enable={{is_pull_request}}
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=ompweb
            org.opencontainers.image.description=Containerized oh-my-pi (omp) + ompweb web UI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OMPWEB_REF=${{ steps.ompweb-ref.outputs.ref }}
            OMP_VERSION=latest
          # Free GHA-backed cache; reduces build time on repeat runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA provenance + SBOM (requires the `attestations: write` perm).
          provenance: true
          sbom: true

      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
